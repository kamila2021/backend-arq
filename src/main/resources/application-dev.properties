# Configuración de base de datos para desarrollo
spring.datasource.url=jdbc:postgresql://localhost:5432/sistemaBdd
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA para desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de correo para desarrollo (usando Mailtrap)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:f4100266030e09}
spring.mail.password=${MAIL_PASSWORD:71a33dc95a0be1}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Nivel de logging más detallado para desarrollo
logging.level.com.arquitectura.proyecto=DEBUG
logging.level.org.springframework.security=DEBUG 